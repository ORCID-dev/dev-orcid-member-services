name: sast

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  sast:
    permissions:
      contents: read
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/sast.yml@v1
    with:
      java-version: '21'
    secrets:
      semgrep-app-token: ${{ secrets.SEMGREP_APP_TOKEN }}
